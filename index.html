<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cheong Sarak Jewelry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a quiet jeweller's ledger. Pearl-grey ground, deep green-black ink, gold used only for focus and price emphasis. */
:root {
  --bg: #F1F3F0; --surface: #FFFFFF; --surface-2: #E7EBE7; --ink: #14211D; --muted: #55645E; --line: #D3D9D3;
  --gold: #7F5C0E; --gold-fill: #C79F45; --ring: #A57A12; --primary: #14211D; --on-primary: #F1F3F0;
  --ok: #226C46; --ok-bg: #DDEFE4; --warn: #8A5A00; --warn-bg: #F8EBCB; --bad: #A52F25; --bad-bg: #F8DEDA; --on-bad: #FFFFFF;
  --bar-bg: #F1F3F0; --scrim: rgba(8, 14, 12, .55); --shadow: 0 1px 2px rgba(20, 33, 29, .06), 0 8px 24px rgba(20, 33, 29, .08);
  --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --body: 'Hanken Grotesk', 'Noto Sans Khmer', 'Khmer OS', 'Leelawadee UI', 'Khmer Sangam MN', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1311; --surface: #131C19; --surface-2: #1A2622; --ink: #E8EEEA; --muted: #97A8A1; --line: #26332E;
    --gold: #D8B461; --gold-fill: #C79F45; --ring: #E7C77A; --primary: #D8B461; --on-primary: #14211D;
    --ok: #5CC38B; --ok-bg: #12301F; --warn: #E5B04A; --warn-bg: #33290F; --bad: #F0786B; --bad-bg: #3A1713; --on-bad: #1A0907;
    --bar-bg: #0C1311; --scrim: rgba(0, 0, 0, .66); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1311; --surface: #131C19; --surface-2: #1A2622; --ink: #E8EEEA; --muted: #97A8A1; --line: #26332E;
  --gold: #D8B461; --gold-fill: #C79F45; --ring: #E7C77A; --primary: #D8B461; --on-primary: #14211D;
  --ok: #5CC38B; --ok-bg: #12301F; --warn: #E5B04A; --warn-bg: #33290F; --bad: #F0786B; --bad-bg: #3A1713; --on-bad: #1A0907;
  --bar-bg: #0C1311; --scrim: rgba(0, 0, 0, .66); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bar-bg); z-index: 40; }
h1, h2, h3, p { margin: 0; }
h1 { font-family: var(--display); font-weight: 500; font-size: clamp(1.9rem, 5vw, 2.9rem); line-height: 1.06; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-size: 1.05rem; font-weight: 650; letter-spacing: .01em; }
h3 { font-size: 1rem; font-weight: 600; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--mono); font-size: .8rem; letter-spacing: .01em; }
.dim { color: var(--muted); }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .14em; color: var(--gold); font-weight: 600; }
.sub { color: var(--muted); font-size: .92rem; }
small { font-size: .8rem; color: var(--muted); }

/* top bar */
#topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar-bg); border-bottom: 1px solid var(--line); }
.bar-inner { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 1.55rem; letter-spacing: -.01em; }
.brand span { font-family: var(--mono); font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 550; color: var(--muted); }
.seg button[aria-current="page"] { background: var(--primary); color: var(--on-primary); }
.demo-pill[hidden] { display: none; } .demo-pill { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; border: 1px solid var(--gold-fill); color: var(--gold); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
#theme-btn svg { display: block; }
.icon-btn.lang-btn { width:auto; min-width:42px; padding:0 10px; font-size:13px; font-weight:600; letter-spacing:.02em; }
#theme-btn[data-mode="light"] svg .half { opacity: 0; } #theme-btn[data-mode="dark"] svg .full { opacity: 1; }
.banner { background: var(--warn-bg); color: var(--warn); font-weight: 550; padding-block: 8px; font-size: .88rem; }
#app { max-width: 1240px; margin: 0 auto; padding-block: 26px 70px; min-width: 0; }
.foot { max-width: 1240px; margin: 0 auto; padding-block: 0 28px; color: var(--muted); font-size: .8rem; }
.foot b { font-family: var(--mono); letter-spacing: .1em; color: var(--gold); font-weight: 500; }

/* buttons & controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; transition: background .15s, border-color .15s; line-height: 1.2; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }
.btn.sm { min-height: 32px; padding: 4px 11px; font-size: .86rem; }
.btn:disabled, .icon-btn:disabled { opacity: .45; cursor: not-allowed; }
.danger-text { color: var(--bad); }
.icon-btn { width: 34px; height: 34px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: inline-grid; place-items: center; font-size: 1.1rem; line-height: 1; padding: 0; }
.linklike { background: none; border: 0; padding: 0; color: var(--gold); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-weight: 550; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.grow { flex: 1 1 220px; }
.field.inline { flex-direction: row; align-items: center; gap: 8px; }
label, legend { font-size: .82rem; font-weight: 600; color: var(--ink); }
.req { color: var(--bad); }
input[type=text], input[type=search], input[type=date], select, textarea { width: 100%; min-height: 40px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); }
textarea { resize: vertical; min-height: 88px; }
input[type=file] { max-width: 100%; }
input:hover, select:hover, textarea:hover { border-color: var(--muted); }
[aria-invalid="true"] { border-color: var(--bad) !important; box-shadow: 0 0 0 1px var(--bad); }
.hint { color: var(--muted); font-size: .8rem; }
.err { color: var(--bad); font-size: .82rem; font-weight: 550; min-height: 0; }
.err:empty { display: none; }
.money { display: grid; grid-template-columns: minmax(0, 1fr) 104px; gap: 6px; }
.radios { border: 0; padding: 0; margin: 0 0 4px; display: grid; gap: 6px; min-width: 0; }
.radios legend { padding: 0; margin-bottom: 4px; }
.radio, .check { display: flex; gap: 9px; align-items: flex-start; font-weight: 500; font-size: .92rem; cursor: pointer; }
.radio input, .check input { margin-top: 3px; accent-color: var(--primary); }
.checks { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 12px 0 0; display: grid; gap: 8px; max-height: 260px; overflow: auto; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 18px; min-width: 0; }
.panel.flush { padding: 0; overflow: hidden; }
.panel > h2 { margin-bottom: 14px; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.form-grid { display: grid; grid-template-columns: 1fr; gap: 14px 16px; }
.form-grid.inner { margin-top: 2px; }
.span2 { grid-column: 1 / -1; }
.note { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; color: var(--muted); font-size: .88rem; }
.form-actions, .head-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.head-actions { margin-top: 0; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px; margin-bottom: 20px; }
.page-head .sub { margin-top: 6px; max-width: 62ch; }
.crumb-link { margin-bottom: 8px; font-size: .86rem; }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
.tab { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; margin-bottom: -1px; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--gold-fill); }
.pill { display: inline-block; font-size: .72rem; font-weight: 650; padding: 2px 9px; border-radius: 999px; letter-spacing: .02em; vertical-align: middle; }
.pill.published { background: var(--ok-bg); color: var(--ok); }
.pill.hidden { background: var(--surface-2); color: var(--muted); }
.pill.archived { background: var(--surface-2); color: var(--muted); text-decoration: line-through; }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.flag { display: inline-block; background: var(--warn-bg); color: var(--warn); font-size: .76rem; font-weight: 650; padding: 2px 9px; border-radius: 999px; }
.tag-new { background: var(--ok-bg); color: var(--ok); font-size: .76rem; font-weight: 650; padding: 2px 9px; border-radius: 999px; }
.issue { display: block; color: var(--warn); font-weight: 550; margin-top: 3px; }

/* prices */
.price { display: inline-flex; flex-direction: column; gap: 1px; font-variant-numeric: tabular-nums; }
.price .p1 { font-weight: 650; font-size: 1.05rem; }
.price .p2 { color: var(--muted); font-size: .86rem; }
.price.big .p1 { font-family: var(--display); font-weight: 500; font-size: 2.1rem; letter-spacing: -.01em; line-height: 1.1; }
.price.big .p2 { font-size: 1.05rem; }
.price-missing { color: var(--warn); font-weight: 600; font-size: .9rem; }
.pair { display: inline-flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.diff { display: inline-flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.diff.up b { color: var(--ok); } .diff.down b { color: var(--bad); }

/* showroom */
.shop-hero { display: grid; gap: 22px; margin-bottom: 26px; }
.shop-hero .lede { color: var(--muted); max-width: 54ch; margin-top: 10px; font-size: 1.02rem; }
.shop-hero h1 { margin-top: 6px; }
.rates-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; border-block: 1px solid var(--line); padding-block: 10px; }
.rate-chips { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--mono); font-size: .8rem; font-variant-numeric: tabular-nums; }
.rate-chip b { color: var(--gold); font-weight: 500; }
.shop-controls, .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 14px; }
.shop-controls .field:not(.grow), .toolbar .field:not(.grow) { flex: 0 1 170px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 550; font-size: .88rem; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.chips.sub .chip { font-size: .8rem; padding: 4px 11px; }
.result-count { color: var(--muted); font-size: .86rem; margin: 6px 0 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 18px; }
.card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; text-decoration: none; transition: box-shadow .2s, transform .2s; min-width: 0; }
.card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.card-img, .g-main, .pthumb, .ccover, .ithumb-img, .g-thumb { background: var(--surface-2); }
.card-img { aspect-ratio: 4 / 5; }
.card-img img, .g-main img, .pthumb img, .ccover img, .ithumb-img img, .g-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-ph { width: 100%; height: 100%; display: grid; place-items: center; color: var(--muted); }
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 3px; }
.card-type { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.card-body h3 { font-family: var(--display); font-weight: 500; font-size: 1.2rem; line-height: 1.2; }
.sku { font-family: var(--mono); font-size: .75rem; color: var(--muted); margin-bottom: 8px; }
.empty { text-align: center; padding: 48px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; display: grid; gap: 10px; justify-items: center; grid-column: 1 / -1; }
.empty p { color: var(--muted); max-width: 44ch; }
.empty-line { padding: 18px 20px; color: var(--muted); }
.crumbs { display: flex; flex-wrap: wrap; gap: 8px; font-size: .86rem; color: var(--muted); margin-bottom: 18px; }
.crumbs a { color: var(--gold); font-weight: 600; }
.detail { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
.gallery { min-width: 0; display: grid; gap: 10px; align-content: start; }
.g-main { display: block; width: 100%; aspect-ratio: 4 / 5; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; padding: 0; cursor: zoom-in; }
.g-thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.g-thumb { flex: 0 0 72px; height: 72px; padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; cursor: pointer; }
.g-thumb[aria-pressed="true"] { border-color: var(--gold-fill); }
.info { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.price-block { padding-block: 10px; border-block: 1px solid var(--line); }
.price-note { color: var(--muted); font-size: .84rem; margin-top: 4px; }
.lead { font-size: 1.05rem; }
.body-text { color: var(--muted); max-width: 62ch; }
.specs { display: grid; gap: 0; margin: 4px 0; }
.specs > div { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.specs dt { color: var(--muted); font-size: .86rem; } .specs dd { margin: 0; font-weight: 550; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.related { margin-top: 48px; } .related h2 { font-family: var(--display); font-weight: 500; font-size: 1.6rem; margin-bottom: 16px; }
.preview-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 14px; margin-bottom: 18px; font-size: .9rem; }

/* admin list */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: flex; flex-direction: column; }
.stat b { font-family: var(--display); font-weight: 500; font-size: 1.8rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .84rem; } .stat.warn b { color: var(--warn); }
.plist { display: grid; gap: 10px; }
.prow { display: grid; grid-template-columns: 72px minmax(0, 1fr) 170px 160px; grid-template-areas: "t m p s" "a a a a"; gap: 10px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.prow.is-archived { opacity: .72; }
.pthumb { grid-area: t; width: 72px; height: 90px; border-radius: 6px; overflow: hidden; }
.pmain { grid-area: m; min-width: 0; } .pprice { grid-area: p; } .pstatus { grid-area: s; } .pactions { grid-area: a; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
.pmain h3 { overflow-wrap: anywhere; } .meta { color: var(--muted); font-size: .84rem; display: flex; flex-wrap: wrap; gap: 4px 12px; }

/* editor */
.editor-grid { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.price-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.price-panel h2 { margin-bottom: 12px; }
.breakdown { margin: 0 0 12px; display: grid; gap: 0; }
.breakdown > div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.breakdown dt, .breakdown dd { margin: 0; display: flex; flex-direction: column; } .breakdown dd { text-align: right; font-weight: 600; }
.breakdown small { font-weight: 400; }
.total { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-block: 8px 4px; }
.total > span { font-weight: 650; color: var(--muted); font-size: .86rem; text-transform: uppercase; letter-spacing: .08em; }
.total .price { align-items: flex-end; }
.issues { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: .88rem; }
.issues ul { margin: 6px 0 0; padding-left: 18px; }
.rate-hint { background: var(--surface-2); border-radius: 8px; padding: 9px 12px; font-size: .88rem; margin-top: 4px; }
.rate-hint.warn { background: var(--warn-bg); color: var(--warn); }
.savebar { position: sticky; bottom: 0; z-index: 10; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); margin-top: 18px; box-shadow: var(--shadow); }
.savebar-price .price { flex-direction: row; align-items: baseline; gap: 10px; }
.dropzone { display: grid; place-items: center; text-align: center; padding: 22px 16px; border: 1.5px dashed var(--line); border-radius: 10px; cursor: pointer; color: var(--muted); margin: 8px 0 14px; background: var(--bg); }
.dropzone.over { border-color: var(--gold-fill); background: var(--surface-2); }
.dropzone input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.dropzone:focus-within { outline: 2px solid var(--ring); outline-offset: 2px; }
.igrid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 12px; }
.igrid-empty { color: var(--muted); grid-column: 1 / -1; }
.ithumb { position: relative; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); min-width: 0; }
.ithumb.is-cover { border-color: var(--gold-fill); box-shadow: 0 0 0 1px var(--gold-fill); }
.ithumb-img { display: block; width: 100%; aspect-ratio: 4 / 5; border: 0; padding: 0; cursor: zoom-in; }
.ithumb-bar { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; align-items: center; }
.ithumb-bar .icon-btn { width: 30px; height: 30px; } .ithumb-bar .btn { flex: 1 1 auto; }
.badge-new, .badge-cover { position: absolute; top: 6px; left: 6px; font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); }
.badge-cover { left: auto; right: 6px; background: var(--primary); color: var(--on-primary); }

/* gold weight: traditional units lead, grams are secondary */
.weight { display: flex; flex-direction: column; gap: 1px; margin-bottom: 8px; }
.w-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.w-main { font-weight: 650; font-size: 1.02rem; line-height: 1.6; }
.w-sub { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.weight.big { padding: 12px 14px; background: var(--surface-2); border-radius: 8px; }
.weight.big .w-main { font-size: 1.5rem; line-height: 1.7; }

  has(id) { return this.map.has(id); },

  releaseAll() { Array.from(this.map.keys()).forEach((id) => this.release(id)); this.uploaded.clear(); },

async function prepareImage(file) {
  if (!/^image\//.test(file.type)) throw new Error('not-image');
  if (file.type === 'image/svg+xml' || file.type === 'image/gif') return file;
  try {
    const bmp = await createImageBitmap(file);
    const max = 1600;
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (sc === 1 && file.size < 1500000) { if (bmp.close) bmp.close(); return file; }
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    const type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
    const blob = await new Promise((r) => c.toBlob(r, type, 0.88));
    return blob || file;
  } catch (e) { return file; }
}

u1791\u17C6\u1796\u17D0\u179A\u1793\u17C1\u17C7\u1798\u17B7\u1793\u179F\u17D2\u1790\u17B7\u178F\u1780\u17D2\u1793\u17BB\u1784\u1794\u179A\u17B7\u1794\u1791\u179F\u17BB\u179C\u178F\u17D2\u1790\u17B7\u1797\u17B6\u1796 (HTTPS) \u1791\u17C1\u17D4", "the browser did not allow it (it may need a tap, or permission)": "\u1780\u1798\u17D2\u1798\u179C\u17B7\u1792\u17B8\u179A\u17BB\u1780\u179A\u1780\u1798\u17B7\u1793\u17A2\u1793\u17BB\u1789\u17D2\u1789\u17B6\u178F\u1791\u17C1 (\u1794\u17D2\u179A\u17A0\u17C2\u179B\u1787\u17B6\u178F\u17D2\u179A\u17BC\u179C\u1785\u17BB\u1785\u179B\u17BE\u17A2\u17C1\u1780\u17D2\u179A\u1784\u17CB \u17AC\u1795\u17D2\u178F\u179B\u17CB\u1780\u17B6\u179A\u17A2\u1793\u17BB\u1789\u17D2\u1789\u17B6\u178F)\u17D4", "this browser cannot copy images": "\u1780\u1798\u17D2\u1798\u179C\u17B7\u1792\u17B8\u179A\u17BB\u1780\u179A\u1780\u1793\u17C1\u17C7\u1798\u17B7\u1793\u17A2\u17B6\u1785\u1785\u1798\u17D2\u179B\u1784\u179A\u17BC\u1794\u1797\u17B6\u1796\u1794\u17B6\u1793\u1791\u17C1\u17D4", "Copy manually": "\u1785\u1798\u17D2\u179B\u1784\u178A\u17C4\u1799\u178A\u17C3", "Automatic copy was blocked. The text is selected so you can copy it yourself.": "\u1780\u17B6\u179A\u1785\u1798\u17D2\u179B\u1784\u178A\u17C4\u1799\u179F\u17D2\u179C\u17D0\u1799\u1794\u17D2\u179A\u179C\u178F\u17D2\u178F\u17B7\u178F\u17D2\u179A\u17BC\u179C\u1794\u17B6\u1793\u179A\u17B6\u179A\u17B6\u17C6\u1784\u17D4 \u17A2\u178F\u17D2\u1790\u1794\u1791\u178F\u17D2\u179A\u17BC\u179C\u1794\u17B6\u1793\u1787\u17D2\u179A\u17BE\u179F\u179A\u17BE\u179F\u179A\u17BD\u1785\u17A0\u17BE\u1799 \u178A\u17BC\u1785\u17D2\u1793\u17C1\u17C7\u17A2\u17D2\u1793\u1780\u17A2\u17B6\u1785\u1785\u1798\u17D2\u179B\u1784\u179C\u17B6\u178A\u17C4\u1799\u1781\u17D2\u179B\u17BD\u1793\u17AF\u1784\u17D4", "Press and hold the text, then choose Copy. On a computer press Ctrl+C or \u2318C.": "\u1785\u17BB\u1785\u179F\u1784\u17D2\u1780\u178F\u17CB\u179B\u17BE\u17A2\u178F\u17D2\u1790\u1794\u1791 \u179A\u17BD\u1785\u1787\u17D2\u179A\u17BE 4\u1789\u17D2\u1785\u17BC\u179B\u1791\u1798\u17D2\u1784\u1793\u17CB\u1796\u17C1\u1787\u17D2\u179A\u1787\u17B6\u17AF\u1780\u178F\u17B6\u1780\u17B6\u179A\u17C9\u17B6\u178F\u17CB\u17D4", "Diamond weight must be a number, for example 0.50.": "\u1791\u1798\u17D2\u1784\u1793\u17CB\u1796\u17C1\u1787\u17D2\u179A\u178F\u17D2\u179A\u17BC\u179C\u178F\u17C2\u1787\u17B6\u179B\u17C1\u1781 \u17A7\u1791\u17B6\u17A0\u179A\u178E\u17CD 0.50\u17D4", "Diamond weight must be greater than zero.": "\u1791\u1798\u17D2\u1784\u1793\u17CB\u1796\u17C1\u1787\u17D2\u179A\u178F\u17D2\u179A\u17BC\u179C\u178F\u17C2\u1792\u17C6\u1787\u17B6\u1784\u179F\u17BC\u1793\u17D2\u1799\u17D4", "Enter a selling price before publishing.": "\u179F\u17BC\u1798\u1794\u1789\u17D2\u1785\u17BC\u179B\u178F\u1798\u17D2\u179B\u17C3\u179B\u1780\u17CB \u1798\u17BB\u1793\u1793\u17B9\u1784\u178A\u17B6\u1780\u17CB\u1794\u1784\u17D2\u17A0\u17B6\u1789\u1795\u179B\u17B7\u178F\u1795\u179B\u17D4", "This product cannot be published without a valid selling price.": "\u1798\u17B7\u1793\u17A2\u17B6\u1785\u178A\u17B6\u1780\u17CB\u1794\u1784\u17D2\u17A0\u17B6\u1789\u1795\u179B\u17B7\u178F\u1795\u179B\u1793\u17C1\u17C7\u1794\u17B6\u1793\u1791\u17C1 \u1794\u17BE\u1782\u17D2\u1798\u17B6\u1793\u178F\u1798\u17D2\u179B\u17C3\u179B\u1780\u17CB\u178F\u17D2\u179A\u17B9\u1798\u178F\u17D2\u179A\u17BC\u179C\u17D4", "No selling price entered.": "\u1798\u17B7\u1793\u1791\u17B6\u1793\u17CB\u1794\u17B6\u1793\u1794\u1789\u17D2\u1785\u17BC\u179B\u178F\u1798\u17D2\u179B\u17C3\u179B\u1780\u17CB\u1791\u17C1\u17D4", "The selling price is not a valid number.": "\u178F\u1798\u17D2\u179B\u17C3\u179B\u1780\u17CB\u1798\u17B7\u1793\u1798\u17C2\u1793\u1787\u17B6\u179B\u17C1\u1781\u178F\u17D2\u179A\u17B9\u1798\u178F\u17D2\u179A\u17BC\u179C\u1791\u17C1\u17D4", "The selling price cannot be negative.": "\u178F\u1798\u17D2\u179B\u17C3\u179B\u1780\u17CB\u1798\u17B7\u1793\u17A2\u17B6\u1785\u1787\u17B6\u179B\u17C1\u1781\u17A2\u179C\u17B7\u1787\u17D2\u1787\u1798\u17B6\u1793\u1794\u17B6\u1793\u1791\u17C1\u17D4", "The selling price must be greater than zero.": "\u178F\u1798\u17D2\u179B\u17C3\u179B\u1780\u17CB\u178F\u17D2\u179A\u17BC\u179C\u178F\u17C2\u1792\u17C6\u1787\u17B6\u1784\u179F\u17BC\u1793\u17D2\u1799\u17D4", "Choose a currency for the selling price.": "\u179F\u17BC\u1798\u1787\u17D2\u179A\u17BE\u179F\u179A\u17BE\u179F\u179A\u17BC\u1794\u17B7\u1799\u1794\u17D0\u178E\u17D2\u178E\u179F\u1798\u17D2\u179A\u17B6\u1794\u17CB\u178F\u1798\u17D2\u179B\u17C3\u179B\u1780\u17CB\u17D4", "Your edits are still here. Press Save again when the connection is back.": "\u1780\u17B6\u179A\u1780\u17C2\u1794\u17D2\u179A\u17C2\u179A\u1794\u179F\u17CB\u17A2\u17D2\u1793\u1780\u1793\u17C5\u178F\u17C2\u1798\u17B6\u1793\u17D4 \u179F\u17BC\u1798\u1785\u17BB\u1785 \u00AB\u179A\u1780\u17D2\u179F\u17B6\u1791\u17BB\u1780\u00BB \u1798\u17D2\u178F\u1784\u1791\u17C0\u178F \u1793\u17C5\u1796\u17C1\u179B\u1780\u17B6\u179A\u178F\u1797\u17D2\u1787\u17B6\u1794\u17CB\u178F\u17D2\u179A\u17A1\u1794\u17CB\u1798\u1780\u179C\u17B7\u1789\u17D4", "Discard unsaved changes?": "\u1794\u17C4\u17C7\u1794\u1784\u17CB\u1780\u17B6\u179A\u1795\u17D2\u179B\u17B6\u179F\u17CB\u1794\u17D2\u178F\u17BC\u179A\u178A\u17C2\u179B\u1798\u17B7\u1793\u1791\u17B6\u1793\u17CB\u179A\u1780\u17D2\u179F\u17B6\u1791\u17BB\u1780\u1798\u17C2\u1793\u1791\u17C1?", "Your edits and any newly added photos will be thrown away.": "\u1780\u17B6\u179A\u1780\u17C2\u1794\u17D2\u179A\u17C2\u179A\u1794\u179F\u17CB\u17A2\u17D2\u1793\u1780 \u1793\u17B7\u1784\u179A\u17BC\u1794\u1790\u178F\u178A\u17C2\u179B\u1791\u17BE\u1794\u1794\u1793\u17D2\u1790\u17C2\u1798\u1793\u17B9\u1784\u178F\u17D2\u179A\u17BC\u179C\u1794\u17C4\u17C7\u1794\u1784\u17CB\u1785\u17C4\u179B\u17D4", "Your edits to this product have not been saved.": "\u1780\u17B6\u179A\u1780\u17C2\u1794\u17D2\u179A\u17C2\u179B\u17BE\u1795\u179B\u17B7\u178F\u1795\u179B\u1793\u17C1\u17C7\u1798\u17B7\u1793\u1791\u17B6\u1793\u17CB\u178F\u17D2\u179A\u17BC\u179C\u1794\u17B6\u1793\u179A\u1780\u17D2\u179F\u17B6\u1791\u17BB\u1780\u1791\u17C1\u17D4", "Discard changes": "\u1794\u17C4\u17C7\u1794\u1784\u17CB\u1780\u17B6\u179A\u1795\u17D2\u179B\u17B6\u179F\u17CB\u1794\u17D2\u178F\u17BC\u179A", "Products point to a category by a permanent ID, so renaming never breaks an assignment. The showroom updates right away.": "\u1795\u179B\u17B7\u178F\u1795\u179B\u1797\u17D2\u1787\u17B6\u1794\u17CB\u1791\u17C5\u1793\u17B9\u1784\u1794\u17D2\u179A\u1797\u17C1\u1791\u178F\u17B6\u1798\u179A\u1799\u17C8\u179B\u17C1\u1781\u179F\u1798\u17D2\u1782\u17B6\u179B\u17CB\u17A2\u1785\u17B7\u1793\u17D2\u178F\u17D2\u179A\u17C3\u1799\u17CD \u178A\u17BC\u1785\u17D2\u1793\u17C1\u17C7\u1780\u17B6\u179A\u1794\u17D2\u178F\u17BC\u179A\u1788\u17D2\u1798\u17C4\u17C7\u1798\u17B7\u1793\u1794\u17C9\u17C7\u1796\u17B6\u179B\u17CB\u178A\u179B\u17CB\u1780\u17B6\u179A\u1780\u17C6\u178E\u178F\u17CB\u1794\u17D2\u179A\u1797\u17C1\u1791\u1791\u17C1\u17D4 \u1780\u17B6\u178F\u17B6\u17A1\u17BB\u1780\u1792\u17D2\u179C\u17BE\u1794\u1785\u17D2\u1785\u17BB\u1794\u17D2\u1794\u1793\u17D2\u1793\u1797\u17B6\u1796\u1797\u17D2\u179B\u17B6\u1798\u17D7\u17D4", "Add category": "\u1794\u1793\u17D2\u1790\u17C2\u1798\u1794\u17D2\u179A\u1797\u17C1\u1791", "Active": "\u179F\u1780\u1798\u17D2\u1798", "Rename": "\u1794\u17D2\u178F\u17BC\u179A\u1788\u17D2\u1798\u17C4\u17C7", "Add": "\u1794\u1793\u17D2\u1790\u17C2\u1798", "Hide category": "\u179B\u17B6\u1780\u17CB\u1794\u17D2\u179A\u1797\u17C1\u1791\u1793\u17C1\u17C7", "Reactivate": "\u1794\u17BE\u1780\u178A\u17C6\u178E\u17BE\u179A\u1780\u17B6\u179A\u179C\u17B7\u1789", "Move products": "\u1795\u17D2\u179B\u17B6\u179F\u17CB\u1791\u17B8\u1795\u179B\u17B7\u178F\u1795\u179B", "Delete category": "\u179B\u17BB\u1794\u1794\u17D2\u179A\u1797\u17C1\u1791", "Hide this category?": "\u179B\u17B6\u1780\u17CB\u1794\u17D2\u179A\u1797\u17C1\u1791\u1793\u17C1\u17C7\u1798\u17C2\u1793\u1791\u17C1?", "Move this category's products first.": "\u179F\u17BC\u1798\u1795\u17D2\u179B\u17B6\u179F\           const r = await Api.call('saveProduct', { product: p, baseUpdatedAt: this.baseTs.has(p.id) ? this.baseTs.get(p.id) : undefined });
          const i = S.products.findIndex((x) => x.id === p.id); if (i >= 0) S.products[i] = r.product;
          this.products.set(p.id, JSON.stringify(r.product)); this.baseTs.set(p.id, r.product.updatedAt);
        } catch (e) {
          if (e.code === 'conflict') {
            const i = S.products.findIndex((x) => x.id === p.id), cur = e.extra.current;
            if (cur) { if (i >= 0) S.products[i] = cur; this.products.set(p.id, JSON.stringify(cur)); this.baseTs.set(p.id, cur.updatedAt); } else { if (i >= 0) S.products.splice(i, 1); this.products.delete(p.id); this.baseTs.delete(p.id); }
            toast(e.message + ' Their version is now shown; your change was not saved.', 'bad');
            return { ok: false, code: 'conflict', message: e.message };
          }
          if (e.code === 'invalid') {
            const i = S.products.findIndex((x) => x.id === p.id), snap = this.products.get(p.id);
            if (snap) { if (i >= 0) S.products[i] = JSON.parse(snap); } else if (i >= 0) S.products.splice(i, 1);
            return { ok: false, code: 'invalid', message: e.message };
          }
          throw e;
        }
      }
      for (const id of Array.from(this.products.keys())) {
        if (S.products.some((p) => p.id === id)) continue;
        await Api.call('deleteProduct', { id });
        this.products.delete(id); this.baseTs.delete(id);
      }
      this.dirtyFail = null; Sync.banner();
      return { ok: true };
    } catch (e) {
      this.dirtyFail = e;
      if (e.code === 'network') { this.retryTimer = setTimeout(() => this.flush(), 6000); }
      Sync.banner();
      return { ok: false, code: e.code, message: e.message };
    }
  },
  banner() { updateStorageBanner(); }
};

const ERR_KEYS = ['name', 'sku', 'cat', 'status', 'purity', 'hun', 'chi', 'li', 'weight', 'carat', 'price'];
function validateDraft(d) {
  const e = {};
  if (!d.name.trim()) e.name = 'Enter a product name.';
  const sku = d.sku.trim();
  if (!sku) e.sku = 'Enter a unique product code.';
  else if (!/^[A-Za-z0-9][A-Za-z0-9._\-\/ ]*$/.test(sku)) e.sku = 'Use letters, numbers, dots, dashes or slashes.';
  else { const dup = S.products.find((p) => p.id !== d.id && p.sku.trim().toLowerCase() === sku.toLowerCase()); if (dup) e.sku = 'Code already used by \u201C' + dup.name + '\u201D. Each code must be unique.'; }
  if (!catById(d.categoryId)) e.cat = 'Choose a category.';
  if (hasGold(d.type)) {
    if (!d.purity) e.purity = 'Choose a gold purity.';
    const wu = CatalogMath.parseUnits(d);
    ['hun', 'chi', 'li'].forEach((k) => { if (wu.errors[k]) e[k] = wu.errors[k]; });
    if (wu.grams !== null && !(wu.grams > 0)) e.weight = 'Gold weight must be greater than zero. Enter at least one of \u17A0\u17CA\u17BB\u1793, \u1787\u17B8 or \u179B\u17B8.';
  }
  if (hasDiamond(d.type)) {
    const v = PX(d.diamondCarat);
    if (v === null) e.carat = 'Enter the diamond weight in carats.';
    else if (isNaN(v)) e.carat = 'Diamond weight must be a number, for example 0.50.';
    else if (v <= 0) e.carat = 'Diamond weight must be greater than zero.';
  }
  const raw = PX(d.price.value);
  if (raw === null) { if (d.status === 'published') e.price = 'Enter a selling price before publishing.'; }
  else { const r = CatalogMath.parsePrice(d.price); if (!r.ok) e.price = r.issue; }
  if (d.status === 'published' && e.price) e.status = 'This product cannot be published without a valid selling price.';
  return e;
}

}

async function addFiles(fileList) {
  const files = Array.from(fileList || []); if (!files.length || !V.edit) return;
  let bad = 0, good = 0;
  for (const f of files) {
    try { const blob = await prepareImage(f); const id = Pending.add(blob, f.name); V.edit.draft.images.push(id); if (!V.edit.draft.cover) V.edit.draft.cover = id; good++; } catch (e) { bad++; }
  }
  renderEditorImages();
  if (good) toast(good + ' photo' + (good > 1 ? 's' : '') + ' added. Save the product to keep ' + (good > 1 ? 'them' : 'it') + '.');
  if (bad) toast(bad + ' file' + (bad > 1 ? 's were' : ' was') + ' skipped because ' + (bad > 1 ? 'they are' : 'it is') + ' not an image.', 'bad');
}

/* ---------- editor: save / cancel ---------- */
handlers['cancel-edit'] = async () => {
  if (editorDirty() && !(await confirmDialog({ title: 'Discard unsaved changes?', body: 'Your edits and any newly added photos will be thrown away.', confirmText: 'Discard changes', danger: true }))) return;
  Pending.releaseAll(); V.edit = null; renderProducts($('#admin-body')); window.scrollTo(0, 0);
};
handlers['save-product'] = async () => {
  const ed = V.edit; if (!ed) return;
  readForm(); ed.submitted = true;
  const errs = validateDraft(ed.draft); showErrors(errs);
  const keys = Object.keys(errs);
  if (keys.length) {
    const first = $('[data-k="' + keys[0] + '"]') || $('#f-name');
    if (first) { first.focus(); first.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    toast('Fix ' + keys.length + ' highlighted field' + (keys.length > 1 ? 's' : '') + ' before saving.', 'bad'); return;
  }
  const p = normalizeDraft(ed.draft); p.updatedAt = nowISO();
  const saveBtns = $$('[data-act="save-product"]'); saveBtns.forEach((b) => { b.disabled = true; });
  try {
    let map = {};
    try { map = await Pending.commit(p.images); } catch (e) { toast('A photo could not be uploaded: ' + e.message + ' Nothing was saved.', 'bad'); return; }
    if (isRemote()) { p.images = p.images.map((i) => map[i] || i); p.cover = map[p.cover] || p.cover; ed.draft.images = p.images.slice(); ed.draft.cover = p.cover; }
    const prev = ed.isNew ? null : clone(S.products.find((x) => x.id === p.id));
    if (ed.isNew) { p.createdAt = p.updatedAt; S.products.unshift(p); } else { const i = S.products.findIndex((x) => x.id === p.id); p.createdAt = S.products[i].createdAt; p.updatedBy = S.products[i].updatedBy; S.products[i] = p; }
    const res = await persist();
    if (!res.ok) {
      if (res.code === 'conflict') { Pending.releaseAll(); V.edit = null; renderProducts($('#admin-body')); window.scrollTo(0, 0); return; }
      toast('Not saved: ' + res.message + (res.code === 'network' ? ' Your edits are still here. Press Save again when the connection is back.' : ''), 'bad');
      if (res.code === 'invalid') { /* the server refused it; the list already shows the old version */ }
      renderEditorImages(); return;
    }
    Pending.releaseAll(); await gcImages(); V.edit = null; renderProducts($('#admin-body')); window.scrollTo(0, 0);
    toast((ed.isNew ? 'Added ' : 'Saved ') + '\u201C' + p.name + '\u201D' + (isRemote() ? ' to the server' : ''));
  } finally { saveBtns.forEach((b) => { b.disabled = false; }); }
};

  const el = $('#wd-preview'); if (!el) return;
  el.innerHTML = '<span class="eyebrow">Example: \u17A0\u17CA\u17BB\u1793 5, \u1787\u17B8 1, \u179B\u17B8 8</span>' + weightHTML({ type: 'gold', gold_hun: 5, gold_chi: 1, gold_li: 8 }, true);
}
function setWeightDisplay(mode) {
  S.settings.weightDisplay = mode; persist(); wdPreview(); toast('Weight display: ' + WEIGHT_MODES[mode]);
}

/* =====================================================================
   CATEGORIES
   ===================================================================== */
const catProducts = (id) => S.products.filter((p) => p.categoryId === id);
function renderCategories(host) {
  const cats = sortedCats();
  host.innerHTML = '<div class="page-head"><div><h1>Categories</h1><p class="sub">Products point to a category by a permanent ID, so renaming never breaks an assignment. The showroom updates right away.</p></div><button class="btn primary" data-act="cat-edit" data-id="">Add category</button></div><div class="cat-list">' +
    cats.map((c, i) => {
      const n = catProducts(c.id).length, live = catProducts(c.id).filter((p) => p.status === 'published').length;
      return '<article class="ccard' + (c.hidden ? ' is-hidden' : '') + '"><div class="ccover">' + imgTag(c.cover, '') + '</div><div class="cmain"><h3>' + esc(c.name) + ' <span class="pill ' + (c.hidden ? 'hidden' : 'published') + '">' + (c.hidden ? 'Hidden' : 'Active') + '</span></h3>' + (c.description ? '<p class="sub">' + esc(c.description) + '</p>' : '') +
        '<p class="meta">' + n + ' product' + (n === 1 ? '' : 's') + (live ? ' (' + live + ' published)' : '') + ' <span class="mono dim">' + esc(c.id) + '</span></p>' +
        '<ul class="subs">' + c.subs.map((s) => '<li><span>' + esc(s.name) + '</span><button class="linklike" data-act="sub-rename" data-c="' + esc(c.id) + '" data-s="' + esc(s.id) + '">Rename</button></li>').join('') + '</ul>' +
        '<div class="sub-add"><label class="sr-only" for="ns-' + esc(c.id) + '">New subcategory in ' + esc(c.name) + '</label><input id="ns-' + esc(c.id) + '" type="text" placeholder="New subcategory" maxlength="40" autocomplete="off"><button class="btn sm" data-act="sub-add" data-c="' + esc(c.id) + '">Add</button></div></div>' +
        '<div class="cact"><div class="reorder"><button class="icon-btn" data-act="cat-move" data-id="' + esc(c.id) + '" data-dir="-1" aria-label="Move ' + esc(c.name) + ' up"' + (i === 0 ? ' disabled' : '') + '>\u2191</button><button class="icon-btn" data-act="cat-move" data-id="' + esc(c.id) + '" data-dir="1" aria-label="Move ' + esc(c.name) + ' down"' + (i === cats.length - 1 ? ' disabled' : '') + '>\u2193</button></div>' +
        '<button class="btn sm" data-act="cat-edit" data-id="' + esc(c.id) + '">Edit</button><button class="btn sm ghost" data-act="cat-toggle" data-id="' + esc(c.id) + '">' + (c.hidden ? 'Reactivate' : 'Hide') + '</button><button class="btn sm ghost" data-act="cat-reassign" data-id="' + esc(c.id) + '"' + (n ? '' : ' disabled') + '>Move products</button><button class="btn sm ghost danger-text" data-act="cat-delete" data-id="' + esc(c.id) + '"' + (n ? ' disabled title="Move its ' + n + ' products first"' : '') + '>Delete</button></div></article>';
    }).join('') + '</div>';
}
handlers['cat-move'] = (el) => {
  const list = sortedCats(), i = list.findIndex((c) => c.id === el.dataset.id), j = i + Number(el.dataset.dir);
  if (j < 0 || j >= list.length) return;
  const t = list[i]; list[i] = list[j]; list[j] = t; list.forEach((c, n) => { c.order = n; });
  persist(); renderCategories($('#admin-body'));
};
handlers['cat-toggle'] = async (el) => {
  const c = catById(el.dataset.id);
  if (c.hidden) { c.hidden = false; persist(); renderCategories($('#admin-body')); toast('\u201C' + c.name + '\u201D is active again.'); return; }
  const n = catProducts(c.id).filter((p) => p.status === 'published').length;
  if (n && !(await confirmDialog({ title: 'Hide this category?', body: n + ' published product' + (n === 1 ? '' : 's') + ' in \u201C' + c.name + '\u201D will disappear from the showroom while it is hidden. They stay assigned to it and return when you reactivate the category. To keep them visible, move them to another category first.', confirmText: 'Hide category', danger: true }))) return;
  c.hidden = true; persist(); renderCategories($('#admin-body')); toast('\u201C' + c.name + '\u201D hidden.');
};
handlers['cat-delete'] = async (el) => {
  const c = catById(el.dataset.id);
  if (catProducts(c.id).length) { toast('Move this category\u2019s products first.', 'bad'); return; }
  if (!(await confirmDialog({ title: 'Delete this category?', body: '\u201C' + c.name + '\u201D has no products. It will be removed along with its subcategories.', confirmText: 'Delete category', danger: true }))) return;
  S.categories = S.categories.filter((x) => x.id !== c.id); sortedCats().forEach((x, n) => { x.order = n; });
  persist(); await gcImages(); renderCategories($('#admin-body')); toast('Category deleted.');
};
handlers['cat-edit'] = (el) => {
  const c = el.dataset.id ? catById(el.dataset.id) : null;
  const st = { cover: c ? c.cover : null, pend: null };
  const api = openModal({
    title: c ? 'Edit category' : 'Add category',
    body: '<div class="form-grid one"><div class="field"><label for="ce-name">Name <span class="req" aria-hidden="true">*</span></label><input id="ce-name" type="text" maxlength="40" value="' + esc(c ? c.name : '') + '" autocomplete="off" data-autofocus><p class="err" id="ce-err" role="alert"></p></div>' +
      '<div class="field"><label for="ce-desc">Description</label><textarea id="ce-desc" rows="3" maxlength="200">' + esc(c ? c.description : '') + '</textarea></div>' +
      '<div class="field"><label for="ce-file">Cover image</label><div class="cover-edit"><div class="ccover" id="ce-prev">' + imgTag(st.cover, '') + '</div><div><input id="ce-file" type="file" accept="image/*"><p><button type="button" class="linklike" id="ce-remove">Remove cover</button></p></div></div></div></div>',
    actions: [{ id: 'cancel', label: 'Cancel', kind: 'ghost' }, { id: 'save', label: c ? 'Save category' : 'Add category', kind: 'primary' }],
    onClose: () => { if (st.pend) Pending.release(st.pend); },
    onAction: async (id, a) => {
      if (id !== 'save') { a.close(); return; }
      const name = $('#ce-name', a.el).value.trim(), err = $('#ce-err', a.el);
      if (!name) { err.textContent = 'Enter a category name.'; return; }
      if (S.categories.some((x) => x.id !== (c && c.id) && x.name.trim().toLowerCase() === name.toLowerCase())) { err.textContent = 'Another category already uses this name.'; return; }
      let cover = st.cover;
      if (st.pend) { try { const m = await Pending.commit([st.pend]); cover = m[st.pend] || st.pend; } catch (e) { toast('The photo could not be uploaded: ' + e.message, 'bad'); return; } st.pend = null; }
      const desc = $('#ce-desc', a.el).value.trim();
      if (c) { c.name = name; c.description = desc; c.cover = cover; }
      else S.categories.push({ id: uid('c'), name, description: desc, cover, hidden: false, order: S.categories.length, subs: [] });
      persist(); await gcImages(); a.close(); renderCategories($('#admin-body')); toast(c ? 'Category saved. Product assignments are unchanged.' : 'Category added.');
    }
  });
  $('#ce-file', api.el).addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { const blob = await prepareImage(f); if (st.pend) Pending.release(st.pend); st.pend = Pending.add(blob, f.name); st.cover = st.pend; $('#ce-prev', api.el).innerHTML = imgTag(st.pend, ''); }
    catch (er) { toast('That file is not an image.', 'bad'); }
  });
  $('#ce-remove', api.el).addEventListener('click', () => { if (st.pend) { Pending.release(st.pend); st.pend = null; } st.cover = null; $('#ce-prev', api.el).innerHTML = imgTag(null, ''); });
};
handlers['sub-add'] = (el) => {
  const c = catById(el.dataset.c), inp = $('#ns-' + el.dataset.c), name = inp.value.trim();
  if (!name) { toast('Type a subcategory name first.', 'bad'); inp.focus(); return; }
  if (c.subs.some((s) => s.name.toLowerCase() === name.toLowerCase())) { toast('That subcategory already exists.', 'bad'); return; }
  c.subs.push({ id: uid('s'), name }); persist(); renderCategories($('#admin-body')); toast('Subcategory added.');
};
handlers['sub-rename'] = (el) => {
  const c = catById(el.dataset.c), s = c.subs.find((x) => x.id === el.dataset.s);
  openModal({
    title: 'Rename subcategory', body: '<div class="field"><label for="sr-name">Name</label><input id="sr-name" type="text" maxlength="40" value="' + esc(s.name) + '" autocomplete="off" data-autofocus><p class="err" id="sr-err" role="alert"></p></div>',
    actions: [{ id: 'cancel', label: 'Cancel', kind: 'ghost' }, { id: 'save', label: 'Rename', kind: 'primary' }],
    onAction: (id, a) => {
      if (id !== 'save') { a.close(); return; }
      const name = $('#sr-name', a.el).value.trim();
      if (!name) { $('#sr-err', a.el).textContent = 'Enter a name.'; return; }
      if (c.subs.some((x) => x.id !== s.id && x.name.toLowerCase() === name.toLowerCase())) { $('#sr-err', a.el).textContent = 'Another subcategory already uses this name.'; return; }
      s.name = name; persist(); a.close(); renderCategories($('#admin-body')); toast('Subcategory renamed everywhere.');
    }
  });
};
handlers['cat-reassign'] = (el) => {
  const c = catById(el.dataset.id), prods = catProducts(c.id), others = sortedCats().filter((x) => x.id !== c.id);
  if (!others.length) { toast('Add another category to move products into.', 'bad'); return; }
  const subOpts = (cid) => '<option value="">None</option>' + catById(cid).subs.map((s) => '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>').join('');
  const api = openModal({
    title: 'Move products out of \u201C' + c.name + '\u201D',
    body: '<div class="form-grid"><div class="field"><label for="ra-cat">Move to</label><select id="ra-cat">' + others.map((o) => '<option value="' + esc(o.id) + '">' + esc(o.name) + (o.hidden ? ' (hidden)' : '') + '</option>').join('') + '</select></div><div class="field"><label for="ra-sub">Subcategory</label><select id="ra-sub">' + subOpts(others[0].id) + '</select></div></div>' +
      '<fieldset class="checks"><legend>Products to move</legend>' + prods.map((p) => '<label class="check"><input type="checkbox" value="' + esc(p.id) + '" checked> <span>' + esc(p.name) + ' <small class="mono">' + esc(p.sku) + '</small></span></label>').join('') + '</fieldset><p class="err" id="ra-err" role="alert"></p>',
    actions: [{ id: 'cancel', label: 'Cancel', kind: 'ghost' }, { id: 'ok', label: 'Move products', kind: 'primary' }],
    onAction: (id, a) => {
      if (id !== 'ok') { a.close(); return; }
      const ids = $$('input[type=checkbox]:checked', a.el).map((x) => x.value);
      if (!ids.length) { $('#ra-err', a.el).textContent = 'Select at least one product.'; return; }
      const target = $('#ra-cat', a.el).value, sub = $('#ra-sub', a.el).value;
      ids.forEach((pid) => { const p = byId(pid); p.categoryId = target; p.subId = sub; p.updatedAt = nowISO(); });
      persist(); a.close(); renderCategories($('#admin-body')); toast(ids.length + ' product' + (ids.length === 1 ? '' : 's') + ' moved to \u201C' + catName(target) + '\u201D.');
    }
  });
  $('#ra-cat', api.el).addEventListener('change', (e) => { $('#ra-sub', api.el).innerHTML = subOpts(e.target.value); });
};

/* =====================================================================
   DEMO DATA
   ===================================================================== */
function renderDemo(host) {
  const bytes = new Blob([JSON.stringify(S)]).size;
  host.innerHTML = '<div class="page-head"><div><h1>Demo data</h1><p class="sub">Everything here lives in this browser only. Nothing is sent anywhere.</p></div></div>' +
    '<section class="panel"><h2>Storage</h2><dl class="kv"><div><dt>Catalog data</dt><dd>' + (bytes / 1024).toFixed(1) + ' KB in localStorage' + (storageOk ? '' : ' <span class="flag">unavailable</span>') + '</dd></div><div><dt>Images</dt><dd>' + Images.cache.size + ' files, ' + (Images.totalBytes() / 1048576).toFixed(2) + ' MB in ' + (Images.ok ? 'IndexedDB' : 'memory only <span class="flag">will be lost on refresh</span>') + '</dd></div><div><dt>Browser quota</dt><dd id="quota">checking\u2026</dd></div></dl>' +
    '<p class="hint">These images are not permanent storage. Clearing site data removes them. The production version stores images in Google Drive.</p></section>' +
    '<section class="panel"><h2>Reset</h2><p>Replace everything (products, categories, settings and images) with the original sample data.</p><div class="form-actions"><button class="btn danger" data-act="reset-demo">Reset demo data</button></div></section>' +
    '<section class="panel"><h2>Connect to your server</h2><p>Paste the Web app URL you get after deploying the Google Apps Script. Products and photos will then be stored in your Google Sheet and Drive instead of this browser, and staff sign in with PINs.</p><div class="field"><label for="srv-url">Web app URL</label><input id="srv-url" type="text" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec"><p class="err" id="srv-err" role="alert"></p></div><div class="form-actions"><button class="btn primary" data-act="connect-server">Connect</button></div></section>' +
    '<section class="panel"><h2>Ready for Phase 2</h2><ul class="plain"><li><b>Weight and price formatting</b> live in one pure module (units.js) with no browser dependencies. The same file runs in Apps Script.</li><li><b>Data access</b> goes through one <code>Repo</code> object. Replace it with a Google Sheets adapter.</li><li><b>Image files</b> go through one <code>Images</code> object. Replace it with a Google Drive adapter.</li><li>Product, category and image IDs are generated and permanent, so rows and files can be matched later.</li></ul></section>';
  try { navigator.storage.estimate().then((e) => { const q = $('#quota'); if (q) q.textContent = (e.usage / 1048576).toFixed(1) + ' MB used of about ' + (e.quota / 1048576).toFixed(0) + ' MB'; }).catch(() => { const q = $('#quota'); if (q) q.textContent = 'not reported by this browser'; }); } catch (e) { const q = $('#quota'); if (q) q.textContent = 'not reported by this browser'; }
}
handlers['reset-demo'] = async () => {
  if (!(await confirmDialog({ title: 'Reset all demo data?', body: 'Every product, category, setting and uploaded image you changed will be replaced by the original sample data. This cannot be undone.', confirmText: 'Reset demo data', danger: true }))) return;
  Pending.releaseAll(); V.edit = null; 
  await Images.clear(); Repo.clear();
  const seed = buildSeed(); S = seed.state; await writeSeedImages(seed.images); persist();
  V.shop = { q: '', cat: 'all', sub: 'all', type: 'all', sort: 'recent' }; V.adm = { q: '', cat: 'all', type: 'all', purity: 'all', status: 'active', sort: 'updated' };
  renderDemo($('#admin-body')); toast('Demo data reset to the original samples.');
};
/* =====================================================================
   MAIN: theme, top bar, global events, boot
   ===================================================================== */
function applyTheme(t) {
  const root = document.documentElement;
  if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
  const b = $('#theme-btn'); if (b) { b.setAttribute('data-mode', t || 'system'); b.setAttribute('aria-label', 'Theme: ' + (t || 'system') + '. Click to change.'); b.title = 'Theme: ' + (t || 'system'); }
}
function currentTheme() { try { return localStorage.getItem(THEME_KEY) || 'system'; } catch (e) { return 'system'; } }
handlers['theme'] = () => {
  const order = ['system', 'light', 'dark'], next = order[(order.indexOf(currentTheme()) + 1) % 3];
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* ignore */ }
  applyTheme(next); toast('Theme: ' + next);
};
handlers['nav-mode'] = async (el) => {
  if (!(await leaveEditor())) return;
  go({ mode: el.dataset.mode, pid: null, preview: false });
};

function updateStorageBanner() {
  const b = $('#banner'); if (!b) return;
  const msgs = [];
  if (isRemote()) { if (remoteStatus()) msgs.push(remoteStatus()); if (Sync.dirtyFail) msgs.push('Changes are not saved to the server yet: ' + Sync.dirtyFail.message + (Sync.dirtyFail.code === 'network' ? ' Retrying automatically.' : '')); }
  if (!isRemote() && !storageOk) msgs.push('Browser storage is blocked, so changes will be lost when this tab closes.');
  if (!isRemote() && !Images.ok) msgs.push('Image storage is unavailable, so uploaded images will not survive a refresh.');
  b.hidden = !msgs.length; b.textContent = msgs.join(' ');
}
function renderTopbar() {
  $$('[data-act="nav-mode"]').forEach((b) => b.setAttribute('aria-current', b.dataset.mode === V.mode ? 'page' : 'false'));
  document.title = V.mode === 'admin' ? 'Cheong Sarak Jewelry' : 'Cheong Sarak Jewelry';
}
function render() { renderTopbar(); if (V.mode === 'shop') { if (V.pid) renderDetail(); else renderShop(); } else renderAdmin(); }

/* delegated clicks */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = handlers[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el, e);
});

/* filters and live fields */
const refreshShop = debounce(() => { if ($('#shop-grid')) updateShopResults(); }, 120);
const refreshAdmin = debounce(() => { if ($('#adm-list')) updateAdminList(); }, 120);
function onFilterInput(e) {
  const t = e.target, id = t.id || '';
  if (id === 'shop-q') { V.shop.q = t.value; refreshShop(); }
  else if (id === 'shop-type') { V.shop.type = t.value; updateShopResults(); }
  else if (id === 'shop-sort') { V.shop.sort = t.value; updateShopResults(); }
  else if (id === 'adm-q') { V.adm.q = t.value; refreshAdmin(); }
  else if (id.indexOf('adm-') === 0) { V.adm[id.slice(4)] = t.value; updateAdminList(); }
  else if (t.name === 'wd' && e.type === 'change') setWeightDisplay(t.value);
}
document.addEventListener('input', onFilterInput);
document.addEventListener('change', onFilterInput);
window.addEventListener('beforeunload', () => Pending.releaseAll());

/* boot */
async function boot() {
  applyTheme(currentTheme());
  if (isRemote()) {
    $('#app').innerHTML = '<div class="empty"><h3>Loading the catalog\u2026</h3></div>';
    try { await remoteBoot(); } catch (e) {
      $('#app').innerHTML = '<div class="empty"><h3>The catalog could not load</h3><p>' + esc(e.message) + '</p><button class="btn primary" data-act="reload-page">Try again</button></div>';
      return;
    }
    const pill = $('#demo-pill'); if (pill) pill.hidden = true;
    const foot = $('#foot'); if (foot) foot.textContent = 'Prices and photos are managed by the shop.';
    const n = readHash(); Object.assign(V, n); updateStorageBanner(); render(); return;
  }
  const saved = Repo.load();
  await Images.init();
  if (saved) {
    S = saved;
    S.settings = Object.assign({ weightDisplay: 'both' }, S.settings);
    persist();
  } else {
    const seed = buildSeed(); S = seed.state;
    await Images.clear();
    await writeSeedImages(seed.images);
    persist();
  }
  const n = readHash(); Object.assign(V, n);
  updateStorageBanner();
  render();
}
boot().catch((err) => {
  const a = document.getElementById('app');
  if (a) a.innerHTML = '<div class="empty"><h3>The catalog could not start</h3><p>' + esc(err && err.message ? err.message : err) + '</p></div>';
});

/* Mobile: keep a focused field visible above the on-screen keyboard. */
document.addEventListener('focusin', (e) => {
  const t = e.target;
  if (!t || !/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName) || !window.matchMedia('(max-width: 900px)').matches) return;
  setTimeout(() => { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) { /* ignore */ } }, 300);
});
</script>
